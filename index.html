<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>portal up2d banten</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">
        <!-- Logo Portal UP2D BANTEN -->
        <div style="display: flex; align-items: center; gap: 8px;">
          <img src="/logo.jpg" alt="Portal UP2D BANTEN" style="height: 40px;" />
          <div style="display: flex; flex-direction: column;">
            <span style="font-weight: 600; font-size: 16px; color: var(--initial-loader-color);">Portal</span>
            <span style="font-size: 12px; opacity: 0.7; color: var(--initial-loader-color);">UP2D BANTEN</span>
          </div>
        </div>
        <div class=" loading">
          <div class="effect-1 effects"></div>
          <div class="effect-2 effects"></div>
          <div class="effect-3 effects"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const loaderColor = localStorage.getItem('vuexy-initial-loader-bg') || '#FFFFFF'
      const primaryColor = localStorage.getItem('vuexy-initial-loader-color') || '#7367F0'

      if (loaderColor)
        document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)
      if (loaderColor)
        document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)

      if (primaryColor)
        document.documentElement.style.setProperty('--initial-loader-color', primaryColor)
    </script>
</body>

</html>
